<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#043E03"/>
      <path d="M0,0 L10,10 M10,0 L0,10" stroke="#0A5C08" stroke-width="1"/>
    </pattern>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.7)"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#grass)"/>
  
  <!-- Field lines -->
  <rect x="460" y="50" width="1000" height="500" stroke="white" stroke-width="5" fill="none"/>
  <circle cx="960" cy="300" r="100" stroke="white" stroke-width="5" fill="none"/>
  <line x1="960" y1="50" x2="960" y2="550" stroke="white" stroke-width="5"/>
  
  <!-- Overlay gradient -->
  <rect width="1920" height="600" fill="url(#overlay)"/>
  
</svg>
